    wq.href="https://wa.me/"+PH+"?text="+encodeURIComponent("ສະບາຍດີ ສົນໃຈ "+p.n+(p.c?" ("+p.c+")":""));wq.target="_blank";wq.rel="noopener";b.appendChild(wq);
    c.appendChild(im);c.appendChild(b);gr.appendChild(c)});
  if(!n){g.appendChild(el("div","em",D.items.length?"ບໍ່ພົບສິນຄ້າທີ່ຄົ້ນຫາ":"ຍັງບໍ່ມີສິນຄ້າ"));return}
  g.appendChild(gr)}
function renderCart(){
  var h=$("cl");h.textContent="";
  if(!cart.length){h.appendChild(el("div","em","ກະຕ່າວ່າງ"))}
  cart.forEach(function(it){
    var p=D.items[it.ix],ln=el("div","ln"),i=el("div","i");
    i.appendChild(el("b",null,(p.c?"["+p.c+"] ":"")+p.n+(it.z?" ("+it.z+")":"")));
    i.appendChild(el("span",null,fm(p.p)+" × "+it.q+" = "+fm(p.p*it.q)+" ກີບ"));
    var qc=el("div","qc"),mi=el("button",null,"−"),pl=el("button",null,"+");
    mi.onclick=function(){it.q--;if(it.q<=0)cart.splice(cart.indexOf(it),1);upd()};
    pl.onclick=function(){if(it.q>=maxOf(p,it.z)){toast("ສະຕັອກບໍ່ພໍ");return}it.q++;upd()};
    qc.appendChild(mi);qc.appendChild(el("b",null,String(it.q)));qc.appendChild(pl);
    var rm=el("button","rm","✕");rm.onclick=function(){cart.splice(cart.indexOf(it),1);upd()};
    ln.appendChild(i);ln.appendChild(qc);ln.appendChild(rm);h.appendChild(ln)});
  $("ct").textContent=fm(total().t)+" ກີບ"}
function upd(){renderCart();bar();if(!cart.length)$("ov").classList.add("hide")}
function buildMsg(){
  var name=$("cn").value.trim(),ph=$("cp").value.trim(),note=$("cm").value.trim();
  var id=Math.random().toString(36).slice(2,8).toUpperCase(),s=total(),L=[];
  L.push("🛒 ອໍເດີໃໝ່ #"+id,"ຊື່: "+name,"ເບີ: "+ph);
  if(note)L.push("ທີ່ຢູ່/ໝາຍເຫດ: "+note);
  L.push("");
  cart.forEach(function(it,i){var p=D.items[it.ix];L.push((i+1)+") "+(p.c?"["+p.c+"] ":"")+p.n+(it.z?" ("+it.z+")":"")+" × "+it.q+" = "+fm(p.p*it.q))});
  L.push("","ລວມ: "+fm(s.t)+" ກີບ","");
  var its=cart.map(function(it){var p=D.items[it.ix];return sc(p.c||p.n)+","+sc(it.z)+","+it.q}).join(";");
  L.push("[KP-ORDER]|"+id+"|"+sx(name)+"|"+sx(ph)+"|"+sx(note)+"|"+its);
  return L.join("\n")}
$("cbo").onclick=function(){renderCart();$("ov").classList.remove("hide")};
$("cls").onclick=function(){$("ov").classList.add("hide")};
$("ov").onclick=function(e){if(e.target===$("ov"))$("ov").classList.add("hide")};
$("clr").onclick=function(){cart=[];upd();$("ov").classList.add("hide")};
$("send").onclick=function(){
  if(!cart.length){toast("ກະຕ່າວ່າງ");return}
  var name=$("cn").value.trim(),ph=$("cp").value.trim();
  if(!name){toast("ກະລຸນາໃສ່ຊື່ຂອງທ່ານ");$("cn").focus();return}
  if(ph.replace(/\D/g,"").length<8){toast("ກະລຸນາໃສ່ເບີໂທໃຫ້ຖືກຕ້ອງ");$("cp").focus();return}
  try{localStorage.setItem("kp_cn",name);localStorage.setItem("kp_cp",ph)}catch(e){}
  var url="https://wa.me/"+PH+"?text="+encodeURIComponent(buildMsg());
  var w=window.open(url,"_blank");if(!w)location.href=url;
  toast("ເປີດ WhatsApp ແລ້ວ ກົດ ສົ່ງ ເພື່ອຢືນຢັນອໍເດີ")};
$("q").oninput=render;render();bar();
</script>
